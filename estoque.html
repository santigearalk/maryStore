<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mary Boutique - Estoque</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- =========================================
         CABEÇALHO
    ========================================== -->

    <header class="topbar">

        <div class="topbar-brand">

            <span>Mary</span>

            <small>BOUTIQUE</small>

        </div>


        <nav class="main-nav">

            <a
                href="estoque.html"
                class="active"
            >
                Estoque
            </a>

            <a href="vendas.html">
                Vendas
            </a>

        </nav>


        <button
            id="logout-button"
            class="logout-button"
        >
            Sair
        </button>

    </header>


    <!-- =========================================
         CONTEÚDO PRINCIPAL
    ========================================== -->

    <main class="page-container">


        <!-- CABEÇALHO DA PÁGINA -->

        <section class="page-header">

            <div>

                <span class="section-label">
                    MARY BOUTIQUE
                </span>

                <h1>
                    Estoque
                </h1>

                <p>
                    Gerencie suas peças disponíveis.
                </p>

            </div>


            <button
                id="open-modal-button"
                class="primary-button"
            >
                + Adicionar produto
            </button>

        </section>


        <!-- =====================================
             RESUMO
        ====================================== -->

        <section class="summary-grid">


            <div class="summary-card">

                <span>
                    Produtos
                </span>

                <strong id="total-products">
                    0
                </strong>

            </div>


            <div class="summary-card">

                <span>
                    Peças em estoque
                </span>

                <strong id="total-stock">
                    0
                </strong>

            </div>


            <div class="summary-card">

                <span>
                    Valor em estoque
                </span>

                <strong id="total-value">
                    R$ 0,00
                </strong>

            </div>


        </section>


        <!-- =====================================
             PESQUISA
        ====================================== -->

        <section class="search-section">

            <input
                type="text"
                id="search-input"
                placeholder="Pesquisar produto..."
            >

        </section>


        <!-- =====================================
             PRODUTOS
        ====================================== -->

        <section
            id="products-grid"
            class="products-grid"
        ></section>


        <p
            id="empty-message"
            class="empty-message"
        >
            Nenhum produto encontrado.
        </p>


    </main>


    <!-- =========================================
         MODAL DE PRODUTO
    ========================================== -->

    <div
        id="product-modal"
        class="modal"
    >

        <div class="modal-content">


            <button
                id="close-modal-button"
                class="modal-close"
                type="button"
            >
                ×
            </button>


            <h2>
                Produto
            </h2>


            <form id="product-form">


                <!-- ID DO PRODUTO -->

                <input
                    type="hidden"
                    id="product-id"
                >


                <!-- IMAGEM -->

                <div class="image-upload">

                    <div id="image-preview">
                        Sem imagem
                    </div>


                    <input
                        type="file"
                        id="image-input"
                        accept="image/*"
                    >

                </div>


                <!-- NOME -->

                <div class="input-group">

                    <label for="product-name">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="product-name"
                        placeholder="Ex: Vestido preto"
                        required
                    >

                </div>


                <!-- CATEGORIA + TAMANHO -->

                <div class="form-row">


                    <div class="input-group">

                        <label for="product-category">
                            Categoria
                        </label>

                        <input
                            type="text"
                            id="product-category"
                            placeholder="Ex: Vestido"
                        >

                    </div>


                    <div class="input-group">

                        <label for="product-size">
                            Tamanho
                        </label>

                        <input
                            type="text"
                            id="product-size"
                            placeholder="Ex: M"
                        >

                    </div>


                </div>


                <!-- COR + QUANTIDADE -->

                <div class="form-row">


                    <div class="input-group">

                        <label for="product-color">
                            Cor
                        </label>

                        <input
                            type="text"
                            id="product-color"
                            placeholder="Ex: Preto"
                        >

                    </div>


                    <div class="input-group">

                        <label for="product-quantity">
                            Quantidade
                        </label>

                        <input
                            type="number"
                            id="product-quantity"
                            min="0"
                            placeholder="0"
                            required
                        >

                    </div>


                </div>


                <!-- PREÇO -->

                <div class="input-group">

                    <label for="product-price">
                        Preço
                    </label>

                    <input
                        type="number"
                        id="product-price"
                        step="0.01"
                        min="0"
                        placeholder="0,00"
                        required
                    >

                </div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    id="save-product-button"
                    class="primary-button"
                >
                    Salvar produto
                </button>


                <!-- MENSAGEM -->

                <p
                    id="product-message"
                    class="message"
                ></p>


            </form>

        </div>

    </div>


    <!-- =========================================
         SCRIPTS
    ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="js/estoque.js"></script>


</body>

</html>
